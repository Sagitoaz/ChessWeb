services:
  mongodb:
    image: mongo:7
    container_name: chessweb-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chessweb-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: chessweb
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      STOCKFISH_BINARY_PATH: /usr/bin/stockfish
      STOCKFISH_TIMEOUT_MS: 5000
    ports:
      - "8080:8080"

volumes:
  mongo_data:
